[tox]
envlist = py{312}-django{52}, js, quality

[testenv]
setenv =
    # tests use moto to fake CreateBucket; breaks in local dev envs configured with a different region
    AWS_DEFAULT_REGION = us-east-1
deps =
    -rrequirements/test.txt
    django52: Django>=5.2,<5.3

commands =
    pytest

[testenv:js]
allowlist_externals = make
deps =
    -rrequirements/test.txt
commands =
    make install-js
    make static
    make test-js

[testenv:quality]
setenv =
    PYTHONPATH = .
allowlist_externals =
    make
    npm
deps =
    -rrequirements/test.txt
    -rrequirements/quality.txt
    -rrequirements/test-acceptance.txt
commands =
    npm install jshint --no-save
    make quality
    python manage.py makemessages -l eo
    make check_translations_up_to_date
    make validate_translations
